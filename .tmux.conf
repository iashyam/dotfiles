unbind `
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

# Vim-style pane navigation with leader key
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set-option -g focus-events on
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
setw -g mode-keys vi
set -g mouse on 
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
# Emulate scrolling behavior from normal terminal windows
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -et='"

set-option -g history-limit 5000

# Open Gemini CLI as a sidebar
bind-key g split-window -h -p 30 -c "#{pane_current_path}" 'gemini'


